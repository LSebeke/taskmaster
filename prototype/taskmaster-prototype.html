<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · Taskmaster</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);--wash:rgba(11,11,11,.05);
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;
  --good:#0ca30c;--goodText:#006300;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--accent:#2a78d6}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--wash:rgba(255,255,255,.06);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--goodText:#0ca30c;--accent:#3987e5}}
:root[data-theme=dark]{color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--wash:rgba(255,255,255,.06);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--goodText:#0ca30c;--accent:#3987e5}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--ring);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover{background:var(--wash)}
button.primary{background:var(--accent);border-color:transparent;color:#fff}
button.on{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select{background:var(--surface);border:1px solid var(--ring);border-radius:6px;padding:2px 6px}
input[type=checkbox]{padding:0}
#top{display:flex;gap:10px;align-items:center;padding:7px 12px;background:var(--surface);border-bottom:1px solid var(--ring);flex-wrap:wrap}
#crumbs{display:flex;gap:4px;align-items:center;font-weight:600;min-width:220px}
#crumbs a{cursor:pointer;color:var(--ink2);font-weight:400}
#crumbs a:hover{color:var(--ink);text-decoration:underline}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:4px;background:var(--warn);color:#0b0b0b}
.spacer{flex:1}
.seg{display:inline-flex;align-items:center;gap:0}
.seg>span{color:var(--ink2);margin-right:6px}
.seg button{border-radius:0;border-left-width:0;padding:2px 8px}
.seg button:first-of-type{border-radius:6px 0 0 6px;border-left-width:1px}
.seg button:last-of-type{border-radius:0 6px 6px 0}
#legend{display:flex;gap:14px;padding:4px 12px;font-size:11px;color:var(--ink2);border-bottom:1px solid var(--ring);background:var(--surface);flex-wrap:wrap;align-items:center}
#legend i{display:inline-block;vertical-align:middle;margin-right:4px}
#main{flex:1;display:grid;grid-template-columns:372px 1fr 372px;min-height:0}
body.nostatus #status{display:none}
body.noeyes .eye{display:none}body.noeyes .row{padding-left:8px}body.nogrid .row{border-bottom-color:transparent}
body.norail #main{grid-template-columns:372px 1fr}body.norail #rail{display:none}
body.nocols .n,body.nocols .s,body.nocols #treeHead span{display:none}
#tree{position:relative;overflow:hidden;background:var(--surface);border-right:1px solid var(--ring)}
#treeHead{position:absolute;top:0;left:0;right:0;height:40px;display:flex;align-items:flex-end;gap:6px;padding:0 10px 5px;font-size:11px;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--axis);z-index:2}
#treeHead b{flex:1;font-weight:500}
#treeHead span{width:40px;text-align:right}#treeHead span:last-child{width:58px}
#treeHead .eye{height:26px;position:relative;left:-4px}
.row{position:absolute;left:0;right:0;height:30px;display:flex;align-items:center;gap:6px;padding-right:10px;border-bottom:1px solid var(--grid);cursor:default;white-space:nowrap}
.row:hover{background:var(--wash)}
.row.sel{background:var(--wash);box-shadow:inset 2px 0 0 var(--accent)}
.row .ind{flex:none}
.eye{width:26px;height:100%;flex:none;border:0;background:none;padding:0;color:var(--ink2);display:flex;align-items:center;justify-content:center;border-radius:0}
.eye:hover{background:var(--wash);color:var(--ink)}.eye.off{color:var(--muted);opacity:.6}
.col{width:28px;height:24px;flex:none;padding:0;font-size:16px;line-height:1;color:var(--ink);text-align:center}
.nocol{width:28px;flex:none;text-align:center;color:var(--muted)}
.fb{flex:none;padding:0 6px;height:22px;display:none;font-size:12px}.row:hover .fb{display:block}.row:hover:has(.fb) .n,.row:hover:has(.fb) .s{display:none}
.row.dropIn{outline:2px solid var(--accent);outline-offset:-2px}.row.dropB{box-shadow:inset 0 3px 0 var(--accent)}.row.dropA{box-shadow:inset 0 -3px 0 var(--accent)}.row.dragsrc{opacity:.45}
.row.sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--page);padding-left:10px;cursor:default}.row.sec .t{flex:1}
.row.hid .t{color:var(--muted);font-style:italic}
.row .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.row.g .t{font-weight:600}
.row .n{width:40px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);flex:none}
.row .s{width:58px;text-align:right;font-variant-numeric:tabular-nums;flex:none;font-size:12px}
.done .t{color:var(--muted);text-decoration:line-through}
#chart{position:relative;min-width:0;overflow:hidden;background:var(--surface)}
#cv{position:absolute;inset:0;width:100%;height:100%}
#scroller{position:absolute;inset:0;overflow:auto}
#spacer{height:1px;width:1px}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:6px;padding:6px 9px;font-size:12px;max-width:300px;display:none;line-height:1.45}
#rail{background:var(--surface);border-left:1px solid var(--ring);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--ring)}
#tabs button{flex:1;border:0;border-radius:0;padding:8px 0;background:none;color:var(--ink2);border-bottom:2px solid transparent}
#tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
#panel{padding:12px;overflow:auto;flex:1;min-height:0}
h2{font-size:15px;margin:0 0 2px}h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px;font-weight:600}
.sub{color:var(--ink2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tile{border:1px solid var(--ring);border-radius:8px;padding:7px 9px}
.tile b{font-size:19px;font-weight:600;display:block;line-height:1.2}
.tile small{color:var(--ink2);font-size:11px;display:block}
.card{border:1px solid var(--ring);border-radius:8px;padding:8px 10px;margin-top:8px}
.card.crit{box-shadow:inset 3px 0 0 var(--crit)}.card.warn{box-shadow:inset 3px 0 0 var(--warn)}.card.good{box-shadow:inset 3px 0 0 var(--good)}
.li{display:flex;gap:6px;padding:3px 0;align-items:baseline}.li .g{flex:1;min-width:0}
.link{cursor:pointer}.link:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.field{display:grid;grid-template-columns:82px 1fr;gap:6px;align-items:center;margin:6px 0}
.field>label{color:var(--ink2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;margin-right:5px}
.td{border:1px solid var(--ring);border-radius:7px;margin-bottom:4px;background:var(--surface)}
.td .hd{display:flex;gap:6px;padding:5px 7px;align-items:center;cursor:grab}
.td .hd .g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td.ovB{box-shadow:0 -3px 0 var(--accent)}.td.ovA{box-shadow:0 3px 0 var(--accent)}
.td ul{list-style:none;margin:0;padding:0 8px 6px 28px}.td li{padding:1px 0}
.td li.x{color:var(--muted);text-decoration:line-through}
.step{display:block;width:100%;text-align:left;margin-top:5px;padding:6px 8px}
.step.next{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.step.ran{color:var(--muted)}
#status{display:flex;gap:14px;padding:5px 12px;font-size:12px;color:var(--ink2);background:var(--surface);border-top:1px solid var(--ring);min-height:29px;align-items:center}
#changes{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#perf{font-variant-numeric:tabular-nums}
button.big{font-weight:600;padding:4px 12px}button:disabled{opacity:.4;cursor:default}
#crumbs{font-size:14px}
#viewMenu{position:absolute;right:0;top:32px;z-index:8;background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:8px 12px;width:230px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#viewMenu label{display:block;padding:2px 0}#viewMenu .btns{display:flex;gap:6px;margin-bottom:6px}
.tier{position:relative;border:1px solid var(--ring);border-radius:9px;margin-bottom:10px;padding:6px;background:var(--page)}
.thd{display:flex;align-items:center;gap:6px;padding:0 2px 5px}.thd b{font-size:13px}.thd .sub{flex:1;font-size:11px}.thd button{padding:0 6px;font-size:11px}
.tier .banner{display:none;position:absolute;left:4px;right:4px;top:3px;z-index:2;pointer-events:none;font-weight:600;font-size:12px;border-radius:5px;padding:3px 7px}
body.dragging .tier{border-style:dashed;border-color:var(--axis)}
.tier.src{opacity:.75}
.tier.same{border:2px solid var(--axis)}.tier.same .banner{display:block;background:var(--ink2);color:var(--surface)}
.tier.cross{border:2px solid var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--page))}.tier.cross .banner{display:block;background:var(--warn);color:#0b0b0b}
.empty{color:var(--muted);font-size:12px;padding:6px 4px;border:1px dashed var(--axis);border-radius:6px;text-align:center}
</style>
</head>
<body>
<div id="top">
  <span class="tag">PROTOTYPE</span>
  <button id="up" class="big" data-a="up" title="Go up one level (Esc)">↑ Up</button>
  <div id="crumbs"></div>
  <button class="big" data-new="project" title="New project">+ Project</button>
  <button class="big" data-new="task" title="New item in the current context (N)">+ Item</button>
  <div class="spacer"></div>
  <span class="seg" id="segPlan"></span>
  <span class="seg" id="segFc"></span>
  <span class="seg" id="segZoom"></span>
  <span class="seg" id="segAxis"></span>
  <span style="position:relative"><button data-a="viewMenu">View ▾</button><div id="viewMenu" hidden></div></span>
  <button id="planBtn" data-a="planOpen" class="primary" title="Forecast changes live. The plan only changes here."></button>
  <button data-a="undo">Undo</button>
</div>
<div id="legend"></div>
<div id="main">
  <div id="tree"><div id="treeHead"></div><div id="rows"></div></div>
  <div id="chart"><canvas id="cv"></canvas><div id="scroller"><div id="spacer"></div></div></div>
  <div id="rail"><div id="tabs"></div><div id="panel"></div></div>
</div>
<div id="status"><span id="changes"></span><span id="nconf" style="color:var(--crit)"></span><span id="perf"></span>
  <label>h/week <input id="cap" type="number" min="1" max="80" style="width:58px"></label>
  <button data-a="day" title="Work the forecast for one day">+1 day</button><button data-a="reset">Reset</button><button data-a="stress" title="Load 1,000 tasks">Stress</button><button data-a="theme">Theme</button></div>
<div id="tip"></div>

<!-- PORTABLE LOGIC: pure, no DOM. Lift into the plugin. -->
<script id="engine">
const Engine = (() => {
  const DAY = 864e5, EPS = 1e-6, HORIZON = 1500;
  const dayOf = s => Math.round(Date.parse(s + 'T00:00:00Z') / DAY);
  const iso = d => new Date(d * DAY).toISOString().slice(0, 10);
  const dow = d => (d + 4) % 7;
  const isWork = (d, s) => { const w = dow(d); return w >= 1 && w <= 5 && !s.holidays.includes(d); };
  const workDays = (a, b, s) => { let n = 0; for (let d = a; d <= b; d++) if (isWork(d, s)) n++; return n; };
  const weekOf = d => Math.floor((d + 3) / 7);
  const weekStart = w => w * 7 - 3;

  const kids = st => { const k = {}; for (const id in st.items) { const p = st.items[id].parent ?? ''; (k[p] ||= []).push(id); } return k; };
  /* One kind of item. Having children decides everything: parents roll up, childless items carry hours. */
  function leavesOf(st, id, K = kids(st)) { const out = [], w = i => { const c = K[i]; if (c) c.forEach(w); else out.push(i); }; w(id); return out; }
  const isDraft = (st, id, K) => { const it = st.items[id]; return it.kind === 'item' && !K[id] && !(it.left > 0) && !(it.spent > 0) && it.doneOn == null; };
  /* An item waits for its own dependencies and those of every ancestor. */
  function effDeps(st, id, K) { const out = new Set(); for (let i = id; i; i = st.items[i].parent) for (const d of st.items[i].deps || []) for (const l of leavesOf(st, d, K)) out.add(l); return [...out]; }
  function rootOf(st, id) { let i = id; while (st.items[i].parent) i = st.items[i].parent; return i; }

  /* Fluid daily simulation. Hours flow from weekly capacity to released tasks.
     Both-pinned: reserved constant burn, taken first.
     Otherwise: highest priority tier takes everything; a tier shares equally. */
  function compile(st, opt) {
    const K = kids(st), ex = opt.exclude || new Set(), scale = opt.scale || (() => 1);
    const ids = Object.keys(st.items).filter(i => !K[i] && !ex.has(i) && !isDraft(st, i, K));
    const tierIx = {}; st.tiers.forEach((t, i) => t.forEach(id => tierIx[id] = i));
    const lastTier = st.tiers.length;
    const ix = {}; ids.forEach((id, i) => ix[id] = i);
    const T = ids.map(id => {
      const it = st.items[id];
      const preds = effDeps(st, id, K).filter(p => p !== id && ix[p] !== undefined).map(p => ix[p]);
      return { id, it, preds, tier: tierIx[id] ?? lastTier, left: (it.left || 0) * scale(id), ms: it.kind === 'ms' || it.kind === 'ext', ext: it.kind === 'ext', root: rootOf(st, id) };
    });
    const order = T.map((_, i) => i).sort((a, b) => T[a].tier - T[b].tier);
    return { ids, ix, T, order };
  }

  function simulate(st, C, rel) {
    const s = st.settings, today = st.today, n = C.T.length, perDay = s.weekly / 5, end = today + HORIZON;
    const left = new Float64Array(n), fin = new Int32Array(n).fill(-1), first = new Int32Array(n).fill(-1), got = new Float64Array(n);
    const idleDay = new Int32Array(n).fill(-1), idleBy = new Int32Array(n).fill(-1);
    const pp = [], weeks = {}, rootIx = {}, todayH = {}, over = [];
    let open = 0;
    C.T.forEach((t, i) => {
      left[i] = t.left;
      if (t.ms) { if (t.it.done) fin[i] = t.it.doneOn ?? today - 1; else open++; return; }
      if (left[i] <= EPS) fin[i] = t.it.doneOn ?? today - 1; else {
        open++;
        if (t.it.pinS != null && t.it.pinE != null) {
          const a = Math.max(t.it.pinS, today), wd = workDays(a, t.it.pinE, s);
          pp.push({ i, a, b: t.it.pinE, burn: wd ? left[i] / wd : left[i], overdue: wd === 0 });
        }
      }
    });
    const isPP = new Uint8Array(n); pp.forEach(p => isPP[p.i] = 1);
    /* An external item blocks through its last day. Work resumes the day after. */
    const passed = (p, d) => fin[p] >= 0 && fin[p] <= (C.T[p].ext ? d - 1 : d);
    const ready = (i, d) => {
      const t = C.T[i];
      if (fin[i] >= 0 || isPP[i]) return false;
      if (t.it.pinS != null) return t.it.pinS <= d;
      if (rel && rel[t.id] != null && rel[t.id] > d) return false;
      for (const p of t.preds) if (!passed(p, d)) return false;
      return true;
    };
    const give = (i, h, d) => {
      left[i] -= h; got[i] += h;
      if (first[i] < 0 && h > EPS) first[i] = d;
      const t = C.T[i], w = weekOf(d); const wk = weeks[w] ||= {}; wk[t.root] = (wk[t.root] || 0) + h;
      if (d === today) todayH[t.id] = (todayH[t.id] || 0) + h;
      if (left[i] <= EPS) { fin[i] = d; open--; }
    };
    for (let d = today; d <= end && open > 0; d++) {
      got.fill(0);
      for (let i = 0; i < n; i++) if (C.T[i].ms && fin[i] < 0) {
        const m = C.T[i];
        if (m.it.pinE != null && m.it.pinE <= d && !isWork(d, s)) { fin[i] = m.it.pinE; open--; }
      }
      if (!isWork(d, s)) continue;
      let cap = perDay;
      for (const p of pp) if (fin[p.i] < 0 && d >= p.a) { const h = d >= p.b ? left[p.i] : Math.min(p.burn, left[p.i]); give(p.i, h, d); cap -= h; }
      if (cap < -EPS) over.push({ day: d, by: -cap }); cap = Math.max(cap, 0);
      let top = -1;
      for (let guard = 0; guard < 4 * n + 8; guard++) {
        // settle milestones
        let settled = false;
        for (let i = 0; i < n; i++) if (C.T[i].ms && fin[i] < 0) {
          const m = C.T[i];
          const ok = m.it.pinE != null ? m.it.pinE <= d : m.preds.every(p => passed(p, d));
          if (ok) { fin[i] = m.it.pinE != null ? m.it.pinE : d; open--; settled = true; }
        }
        if (cap <= EPS) break;
        let tier = -1, act = [];
        for (const i of C.order) {
          if (C.T[i].ms) continue;
          if (tier >= 0 && C.T[i].tier !== tier) break;
          if (ready(i, d)) { tier = C.T[i].tier; act.push(i); }
        }
        if (!act.length) { if (settled) continue; break; }
        if (top < 0) top = act[0];
        let c = cap;
        while (act.length && c > EPS) {
          const share = c / act.length, small = act.filter(i => left[i] <= share + EPS);
          if (small.length) { for (const i of small) { c -= left[i]; give(i, left[i], d); } act = act.filter(i => fin[i] < 0); }
          else { for (const i of act) give(i, share, d); c = 0; }
        }
        cap = Math.max(c, 0);
      }
      for (let i = 0; i < n; i++) if (ready(i, d) && got[i] <= EPS) { idleDay[i] = d; idleBy[i] = top >= 0 ? top : (pp.find(p => got[p.i] > EPS)?.i ?? -1); }
    }
    return { fin, first, left, idleDay, idleBy, weeks, todayH, over };
  }

  function schedule(st, opt = {}) {
    const C = compile(st, opt), today = st.today, rel = {};
    const ap = C.order.map(i => C.T[i]).filter(t => !t.ms && t.left > EPS && t.it.pinE != null && t.it.pinS == null);
    const noRoom = new Set();
    for (const t of ap) {
      let lo = today, hi = t.it.pinE, best = null;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1; rel[t.id] = mid;
        const r = simulate(st, C, rel), f = r.fin[C.ix[t.id]];
        if (f >= 0 && f <= t.it.pinE) { best = mid; lo = mid + 1; } else hi = mid - 1;
      }
      rel[t.id] = best ?? today; if (best == null) noRoom.add(t.id);
    }
    const r = simulate(st, C, rel);
    return { C, r, rel, noRoom };
  }

  function criticalChains(st, S, K) {
    const { C, r } = S, crit = {}, links = [];
    for (const root of (K[''] || []).filter(i => st.items[i].kind !== 'ext')) {
      let last = -1, lastF = -1;
      C.T.forEach((t, i) => { if (t.root === root && !t.ext && r.fin[i] >= st.today && r.fin[i] > lastF) { lastF = r.fin[i]; last = i; } });
      const seen = new Set();
      for (let i = last; i >= 0 && !seen.has(i);) {
        seen.add(i); (crit[C.T[i].id] ||= new Set()).add(root);
        const t = C.T[i], d = r.idleDay[i];
        if (d >= 0 && r.idleBy[i] >= 0 && r.idleBy[i] !== i) { links.push({ a: C.T[r.idleBy[i]].id, b: t.id, kind: 'cap' }); i = r.idleBy[i]; continue; }
        let p = -1, pf = -1;
        for (const q of t.preds) if (r.fin[q] > pf) { pf = r.fin[q]; p = q; }
        if (p < 0 || pf < st.today) break;
        links.push({ a: C.T[p].id, b: t.id, kind: 'dep' }); i = p;
      }
    }
    return { crit, links };
  }

  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  /* Full picture for the UI: forecast, rollups, plan comparison, conflicts. */

  if ('blocks' in d) { if (!t.value) return; const x = t.value; return act(`${st.items[x].title} now waits for ${st.items[id].title}`, s => { s.items[x].deps.push(id); }); }
  if ('left' in d) return act(`${st.items[id].title}: ${t.value}h left`, s => E.setLeft(s.items[id], +t.value || 0, s.today));
  if ('total' in d) return act(`${st.items[id].title}: ${t.value}h total`, s => E.setTotal(s.items[id], +t.value || 0, s.today));
  if (d.logedit != null) return act('Corrected log entry', s => E.editLog(s.items[id], +d.logedit, Math.max(0, +t.value || 0), s.today));
  if (d.notenew && t.value.trim()) { const v = t.value.trim(), x = d.notenew; return act(`Linked [[${v}]]`, s => { (s.items[x].notes ||= []).includes(v) || s.items[x].notes.push(v); }, { silent: true }); }
  if ('prio' in d) return act(`${st.items[id].title}: Priority ${+t.value + 1}`, s => { s.tiers = E.moveToTier(s.tiers, id, +t.value); });
  if (d.show) { ui.show[d.show] = t.checked ? 1 : 0; buildRows(); fitSpacer(); renderTop(); renderRows(); draw(); return; }
  if ('scope' in d) return act(`${st.items[id].title} is ${t.value}`, s => { s.items[id].scope = t.value; });
  if ('dep' in d && t.value) return act('Added dependency', s => { s.items[id].deps.push(t.value); });
  if (d.td) { const [i, n] = d.td.split(':'); return act('To-do', s => { s.items[i].todos[+n].done = t.checked; }, { silent: true }); }
  if (d.tdnew && t.value.trim()) return act('To-do', s => { s.items[d.tdnew].todos.push({ t: t.value.trim(), done: false }); }, { silent: true });
  if (d.plrow) { t.checked ? ui.planDlg.ids.add(d.plrow) : ui.planDlg.ids.delete(d.plrow); return renderPanel(); }
  if ('pldeep' in d) { ui.planDlg.deep = t.checked; return; }
});
function cmd(a) {
  if (a === 'up') { if (ui.focus) setFocus(st.items[ui.focus].parent); }
  if (a === 'viewMenu') { $('#viewMenu').hidden = !$('#viewMenu').hidden; }
  if (a === 'showHidden') { ui.showHidden = !ui.showHidden; renderAll(); }
  if (a === 'clean' || a === 'showAll') {
    $('#viewMenu').hidden = true;
    ui.show = a === 'clean' ? Object.fromEntries(Object.keys(SHOW_ALL).map(k => [k, 0])) : { ...SHOW_ALL };
    if (a === 'clean') { if (ui.plan === 'solid') ui.fc = 'off'; else { ui.fc = 'solid'; ui.plan = 'off'; } } else { ui.plan = 'solid'; ui.fc = 'ghost'; }
    renderAll(); requestAnimationFrame(draw);
  }
  if (a === 'theme') { const dark = getComputedStyle(document.documentElement).colorScheme.includes('dark'); document.documentElement.dataset.theme = dark ? 'light' : 'dark'; readColors(); draw(); }
  if (a === 'reset') { resetState(seed()); ui.scen = null; ui.focus = null; ui.tab = 'overview'; $('#changes').textContent = 'Reset'; renderAll(); centreToday(); draw(); }
  if (a === 'undo' && undoStack.length) { st = JSON.parse(undoStack.pop()); if (ui.sel && !st.items[ui.sel]) ui.sel = null; if (ui.focus && !st.items[ui.focus]) ui.focus = null; recompute(); $('#changes').textContent = 'Undone'; renderAll(); }
  if (a === 'day') act('One working day passed', s => E.advanceDay(s, A));
  if (a === 'stress') { resetState(stressData()); ui.focus = null; ui.expanded = new Set(Object.keys(st.items).filter(i => /^p\d+$/.test(i))); renderAll(); centreToday(); draw(); $('#changes').textContent = '1,110 items loaded. Try panning and dragging. Reset to go back.'; }
  if (a === 'planOpen') { ui.newDlg = null; const sel = ui.sel && !isExt(ui.sel) ? ui.sel : null, rows = sel ? [sel] : ui.focus ? A.K[ui.focus] || [] : projRoots(); ui.planDlg = { rows, ids: new Set(rows), deep: true, name: planTarget() }; ui.tab = 'overview'; renderTabs(); renderPanel(); }
  if (a === 'planCancel') { ui.planDlg = null; renderPanel(); }
  if (a === 'planApply') { const d = ui.planDlg; ui.planDlg = null; const n = act('Plan updated', s => E.updatePlan(s, A, [...d.ids], d.deep), { silent: true }); $('#changes').textContent = `Plan updated on ${n} item(s). Nothing above changed.`; }
}
function setZoom(p, cx) { const sc = $('#scroller'), anchor = cx ?? $('#chart').clientWidth / 2, day = (sc.scrollLeft + anchor) / ui.ppd; ui.ppd = p; fitSpacer(); sc.scrollLeft = day * p - anchor; renderTop(); draw(); }
function startScen(i) {
  const s = SCEN[i]; resetState(seed()); ui.scen = i; ui.scenStep = 0; ui.focus = s.focus; ui.sel = s.sel ?? null; ui.plan = s.plan ?? 'solid'; ui.fc = s.fc ?? 'ghost'; if (s.focus) ui.expanded.add(s.focus);
  ui.tab = 'guide'; $('#changes').textContent = s.name; renderAll();
}
function runStep(j) { const s = SCEN[ui.scen]; act(s.steps[j][0], x => s.steps[j][1](x, ui)); ui.scenStep = j + 1; renderAll(); }

/* chart input */
const scroller = $('#scroller'), tip = $('#tip');
let raf = 0; const schedDraw = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; renderRows(); draw(); }); };
scroller.addEventListener('scroll', schedDraw, { passive: true });
$('#tree').addEventListener('wheel', e => { scroller.scrollTop += e.deltaY; e.preventDefault(); }, { passive: false });
scroller.addEventListener('wheel', e => { if (e.ctrlKey) { e.preventDefault(); const r = scroller.getBoundingClientRect(); setZoom(Math.max(1.5, Math.min(40, ui.ppd * (e.deltaY < 0 ? 1.15 : .87))), e.clientX - r.left); } }, { passive: false });
new ResizeObserver(() => { renderRows(); draw(); }).observe($('#chart'));
const local = e => { const r = scroller.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
const hitAt = p => { for (let i = hits.length - 1; i >= 0; i--) { const h = hits[i]; if (p.x >= h.x0 - 3 && p.x <= h.x1 + 3 && p.y >= h.y0 && p.y <= h.y1) return h; } return null; };
let drag = null, dragBase = null;
scroller.addEventListener('pointerdown', e => {
  const p = local(e), h = hitAt(p); if (!h || e.button) return;
  const canDrag = h.layer === 'fc' && st.items[h.id].kind !== 'ms' && !A.K[h.id] && !A.by[h.id].done && ui.fc !== 'off';
  const edge = h.x1 - h.x0 > 18 ? (p.x < h.x0 + 7 ? 'start' : p.x > h.x1 - 7 ? 'end' : 'move') : 'move';
  drag = { id: h.id, x: p.x, mode: edge, canDrag, moved: false, days: 0 }; dragBase = { s: A.by[h.id].start, e: A.by[h.id].end };
  scroller.setPointerCapture(e.pointerId);
});
scroller.addEventListener('pointermove', e => {
  const p = local(e);
  if (drag) {
    const days = Math.round((p.x - drag.x) / ui.ppd);
    if (Math.abs(p.x - drag.x) > 3) drag.moved = true;
    if (drag.canDrag && drag.moved && days !== drag.days) {
      if (!drag.undo) { drag.undo = JSON.stringify(st); drag.before = A.by; }
      drag.days = days; const it = st.items[drag.id];
      if (drag.mode !== 'end') it.pinS = dragBase.s + days;
      if (drag.mode !== 'start') it.pinE = dragBase.e + days;
      if (drag.mode === 'end' && it.pinE < (it.pinS ?? dragBase.s)) it.pinE = it.pinS ?? dragBase.s;
      if (drag.mode === 'start' && it.pinE != null && it.pinS > it.pinE) it.pinS = it.pinE;
      recompute(); buildRows(); renderRows(); draw();
    }
    tip.style.display = 'none'; return;
  }
  const h = hitAt(p); scroller.style.cursor = h ? (h.x1 - h.x0 > 18 && (p.x < h.x0 + 7 || p.x > h.x1 - 7) && st.items[h.id].kind !== 'ms' && !A.K[h.id] && h.layer === 'fc' ? 'ew-resize' : 'pointer') : '';
  if (!h) { tip.style.display = 'none'; return; }
  const b = A.by[h.id], it = st.items[h.id], pl = st.plan[h.id];
  tip.innerHTML = `<b>${esc(it.title)}</b><br>Forecast ${fmtD(b.start)} → ${fmtD(b.end)}${pl ? `<br>Plan ${fmtD(pl.start)} → ${fmtD(pl.end)}` : ''}${noKids(h.id) ? '' : `<br>${h1(b.spent)}h spent, ${h1(b.left)}h left (${Math.round(b.pct * 100)}%)`}${it.kind !== 'ms' && !A.K[h.id] ? `<br>${why(h.id)}` : ''}`;
  tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 12, innerWidth - 310) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});
scroller.addEventListener('pointerup', e => {
  if (!drag) return; const d = drag; drag = null;
  if (!d.moved) return selectItem(d.id);
  if (d.undo) { undoStack.push(d.undo); showChanges(`Dragged ${st.items[d.id].title}`, d.before); renderAll(); }
});
scroller.addEventListener('dblclick', e => { const h = hitAt(local(e)); if (h) openNote(h.id); });
$('#rows').addEventListener('dblclick', e => { const r = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-row]'); if (r && !e.target.closest?.('button')) openNote(r.dataset.row); });
scroller.addEventListener('pointerleave', () => { tip.style.display = 'none'; });

/* to-do drag */
let dragId = null, dragFrom = -1, dropAt = null;
const clearOv = () => document.querySelectorAll('.td,.tier').forEach(x => x.classList.remove('ovB', 'ovA', 'same', 'cross'));
document.addEventListener('dragstart', e => { const r = e.target.closest?.('[data-drag]'); if (!r) return; dragId = r.dataset.drag; dragFrom = +r.closest('[data-tier]').dataset.tier; e.dataTransfer.effectAllowed = 'move'; document.body.classList.add('dragging'); r.closest('[data-tier]').classList.add('src'); });
document.addEventListener('dragend', () => { clearOv(); document.body.classList.remove('dragging'); document.querySelectorAll('.tier.src').forEach(x => x.classList.remove('src')); dragId = null; });
document.addEventListener('dragenter', e => { if (dragId && e.target.closest?.('[data-tier]')) e.preventDefault(); });
document.addEventListener('dragover', e => {
  if (!dragId) return; clearOv(); dropAt = null;
  const tier = e.target.closest?.('[data-tier]'); if (!tier) return; e.preventDefault();
  const ti = +tier.dataset.tier, rows = [...tier.querySelectorAll('[data-drag]')].filter(r => r.dataset.drag !== dragId);
  const before = rows.find(r => { const b = r.getBoundingClientRect(); return e.clientY < b.top + b.height / 2; });
  if (before) before.classList.add('ovB'); else if (rows.length) rows[rows.length - 1].classList.add('ovA');
  dropAt = { ti, before: before?.dataset.drag ?? null };
  const same = ti === dragFrom; tier.classList.add(same ? 'same' : 'cross');
  tier.querySelector('.banner').textContent = same ? 'Order only: schedule stays the same' : `Moves to Priority ${ti + 1}: changes who gets hours`;
});
document.addEventListener('drop', e => {
  if (!dragId || !dropAt) return; e.preventDefault(); clearOv();
  const { ti, before } = dropAt, id = dragId, same = ti === dragFrom; dragId = null; document.body.classList.remove('dragging');
  act(same ? `Reordered ${st.items[id].title}` : `Moved ${st.items[id].title} to Priority ${ti + 1}`, s => { s.tiers = E.moveToTier(s.tiers, id, ti, before); });
});

/* row drag: move in the hierarchy */
let rowDrag = null, rowDrop = null;
const clearRowOv = () => document.querySelectorAll('.row').forEach(x => x.classList.remove('dropIn', 'dropB', 'dropA'));
document.addEventListener('dragstart', e => { const r = e.target.closest?.('[data-row]'); if (!r || isExt(r.dataset.row)) return; rowDrag = r.dataset.row; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', st.items[rowDrag].title); r.classList.add('dragsrc'); });
document.addEventListener('dragend', () => { if (!rowDrag) return; rowDrag = null; clearRowOv(); document.querySelectorAll('.row.dragsrc').forEach(x => x.classList.remove('dragsrc')); });
document.addEventListener('dragover', e => {
  if (!rowDrag) return; clearRowOv(); rowDrop = null;
  const r = e.target.closest?.('[data-row]'); if (!r || r.dataset.row === rowDrag || isExt(r.dataset.row)) return;
  const tgt = r.dataset.row, b = r.getBoundingClientRect(), f = (e.clientY - b.top) / b.height, ms = st.items[tgt].kind === 'ms';
  const zone = f < .25 || (ms && f < .5) ? 'before' : f > .75 || ms ? 'after' : 'into';
  const sibs = (A.K[st.items[tgt].parent ?? ''] || []).filter(x => x !== rowDrag), parent = zone === 'into' ? tgt : st.items[tgt].parent ?? null;
  const before = zone === 'before' ? tgt : zone === 'after' ? sibs[sibs.indexOf(tgt) + 1] ?? null : null;
  const err = E.moveError(st, rowDrag, parent); if (err) { $('#changes').textContent = '⚠ ' + err; return; }
  e.preventDefault(); r.classList.add({ into: 'dropIn', before: 'dropB', after: 'dropA' }[zone]); rowDrop = { parent, before };
  const T = st.items[tgt], hrs = (T.spent || 0) + (T.left || 0);
  $('#changes').textContent = zone === 'into' ? `Move into ${T.title}${!A.K[tgt] && hrs > 0 ? `: its ${h1(hrs)}h become its budget` : ''}` : `Place ${zone} ${T.title}${!parent ? ' as a project' : ''}`;
});
document.addEventListener('drop', e => {
  if (!rowDrag || !rowDrop) return; e.preventDefault(); clearRowOv();
  const id = rowDrag, { parent, before } = rowDrop; rowDrag = null; rowDrop = null; if (parent) ui.expanded.add(parent);
  act(`Moved ${st.items[id].title}`, s => E.moveItem(s, id, parent, before));
});

/* boot */
readColors(); recompute(); renderAll(); centreToday(); draw();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); draw(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.newDlg) { ui.newDlg = null; renderAll(); return; } if ((e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) { e.preventDefault(); openNew('task'); return; } if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !/INPUT|SELECT/.test(e.target.tagName)) { e.preventDefault(); cmd('undo'); } if (e.key === 'Escape' && !/INPUT|SELECT/.test(e.target.tagName)) { if (ui.planDlg) cmd('planCancel'); else if (ui.sel) { ui.sel = null; renderAll(); } else if (ui.focus) setFocus(st.items[ui.focus].parent); } });
</script>
